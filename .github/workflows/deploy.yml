name: Build and Deploy to Minikube

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image in minikube's Docker
        run: |
          eval $(minikube -p minikube docker-env --shell bash)
          docker build -t interface_status:2.0 .

      - name: Redeploy pod
        run: |
          kubectl delete pod interface-status --ignore-not-found
          kubectl apply -f pod.yaml 

      - name: Debug environment
        run: |
          echo "PATH=$PATH"
          which minikube || echo "minikube not found"
          which docker || echo "docker not found"
          minikube profile list || echo "profile list failed"
          minikube -p minikube docker-env --shell bash || echo "docker-env failed"
